  <path fill="url(#layer1)" d="M0,320 L80,260 L150,300 L230,180 L300,260 L380,150 L460,270 L540,200 L620,300 L700,160 L780,260 L860,190 L940,290 L1020,220 L1100,300 L1200,240 L1200,600 L0,600 Z"/>

