  <path fill="url(#layer2)" d="M0,380 L70,340 L160,400 L250,320 L340,410 L430,330 L520,420 L610,350 L700,430 L790,360 L880,420 L970,340 L1060,410 L1150,350 L1200,390 L1200,600 L0,600 Z"/>

  <!-- front mountain / ground layer -->
  <path fill="url(#layer3)" d="M0,470 L60,440 L140,480 L220,430 L310,490 L400,450 L480,500 L570,460 L660,510 L750,470 L840,505 L930,460 L1020,500 L1110,465 L1200,495 L1200,600 L0,600 Z"/>
