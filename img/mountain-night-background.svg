    <linearGradient id="layer2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f42"/>
      <stop offset="100%" stop-color="#122430"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a24"/>
      <stop offset="100%" stop-color="#060d13"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.6" opacity="0.9"/>
    <circle cx="150" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="260" cy="50" r="1.8" opacity="0.85"/>
    <circle cx="340" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="420" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="520" cy="30" r="1.6" opacity="0.9"/>
    <circle cx="610" cy="100" r="1.2" opacity="0.65"/>
    <circle cx="700" cy="55" r="1.8" opacity="0.85"/>
    <circle cx="790" cy="85" r="1.2" opacity="0.7"/>
    <circle cx="880" cy="40" r="1.6" opacity="0.9"/>
    <circle cx="960" cy="110" r="1.2" opacity="0.6"/>
    <circle cx="1040" cy="60" r="1.8" opacity="0.85"/>
    <circle cx="1120" cy="35" r="1.4" opacity="0.8"/>
    <circle cx="1170" cy="95" r="1.2" opacity="0.65"/>
    <circle cx="200" cy="150" r="1" opacity="0.5"/>
